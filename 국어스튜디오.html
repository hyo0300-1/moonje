<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 스튜디오 · 비해당학원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 국어 스튜디오 - 공통 스타일 */
:root {
  --bg: #f6f6f7;
  --panel: #ffffff;
  --panel-2: #fafafa;
  --fg: #18181b;
  --fg-2: #52525b;
  --muted: #71717a;
  --line: #e4e4e7;
  --line-2: #d4d4d8;
  --accent: #904ae8;
  --accent-weak: color-mix(in oklab, var(--accent) 12%, transparent);
  --accent-fg: #ffffff;
  --ok: #16a34a;
  --warn: #d97706;
  --bad: #dc2626;
  --warn-bg: #fef3c7;
  --radius: 10px;
  --radius-s: 6px;
  --font: "Pretendard", "Pretendard Variable", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
}
[data-theme="dark"] {
  --bg: #111113;
  --panel: #18181b;
  --panel-2: #1f1f23;
  --fg: #f4f4f5;
  --fg-2: #c4c4cc;
  --muted: #9a9aa3;
  --line: #2a2a30;
  --line-2: #3a3a42;
  --warn-bg: #3a2a0b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.55 var(--font); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 레이아웃 ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.brand b { display: block; font-size: 15px; letter-spacing: -0.02em; }
.brand span { font-size: 11px; color: var(--muted); }
.cmd-btn { margin: 4px 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 13px; }
.cmd-btn kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--panel); }
.nav { padding: 4px 10px 16px; overflow: auto; flex: 1; }
.nav .grp { font-size: 11px; color: var(--muted); padding: 14px 8px 6px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; color: var(--fg-2); font-size: 13.5px; }
.nav a svg { width: 16px; height: 16px; flex: none; opacity: .75; }
.nav a:hover { background: var(--panel-2); color: var(--fg); }
.nav a.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.nav a.on svg { opacity: 1; }
.nav a .tag { margin-left: auto; font-size: 10px; color: var(--muted); font-weight: 500; font-style: normal; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { color: var(--fg); font-weight: 600; }
.top-r { display: flex; align-items: center; gap: 8px; }
.view { flex: 1; overflow: auto; padding: 24px 28px 80px; }
.view:focus { outline: none; }
.view.flush { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 700; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- 공통 컴포넌트 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h3 { font-size: 14px; font-weight: 600; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.card-b { padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.hidden { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn svg { width: 15px; height: 15px; }
.icon-btn { width: 28px; height: 28px; padding: 0; }

.seg { display: inline-flex; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--fg-2); }
.seg button.on { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .lbl { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.input, select.input, textarea.input { height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel); outline: none; min-width: 0; }
textarea.input { height: auto; padding: 10px; line-height: 1.7; resize: vertical; }
.field .input { width: 100%; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); color: var(--fg-2); background: var(--panel); white-space: nowrap; }
.chip.accent { border-color: transparent; background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.chip.ok { border-color: transparent; background: color-mix(in oklab, var(--ok) 14%, transparent); color: var(--ok); }
.chip.warn { border-color: transparent; background: color-mix(in oklab, var(--warn) 16%, transparent); color: var(--warn); }
.chip.bad { border-color: transparent; background: color-mix(in oklab, var(--bad) 14%, transparent); color: var(--bad); }
.chip.btnchip { cursor: pointer; }
.chip.btnchip.on { background: var(--accent); color: #fff; border-color: transparent; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { left: 16px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.bar-track { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- 작업 큐 ---------- */
.jobs-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .2s; z-index: 30; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer-b { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.job { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.job-t { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
.job-s { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.job-ev { margin-top: 8px; max-height: 160px; overflow: auto; font-size: 11.5px; font-family: var(--mono); color: var(--fg-2); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
.job-ev div { white-space: pre-wrap; }
.job-ev .fallback { color: var(--warn); }
.job-ev .failed { color: var(--bad); }

/* ---------- 작업 요청창 ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.palette { width: min(620px, 92vw); background: var(--panel); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; border: 1px solid var(--line); }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 15px; outline: none; background: transparent; }
.palette .list { max-height: 360px; overflow: auto; padding: 6px; }
.palette .it { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.palette .it.on { background: var(--accent-weak); }
.palette .it small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.palette .plan { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); background: var(--panel-2); }
.palette .plan ol { margin: 6px 0 0; padding-left: 18px; }

.toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: #18181b; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); animation: tin .2s ease-out; }
.toast.bad { background: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }

/* ---------- 시험지 분석·저장 ---------- */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; background: var(--panel); text-align: left; }
.mode b { display: block; font-size: 14px; }
.mode span { font-size: 12px; color: var(--muted); }
.mode.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 26px 16px; text-align: center; background: var(--panel-2); transition: .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop b { font-size: 14px; }
.drop p { margin: 4px 0 12px; font-size: 12px; color: var(--muted); }
.pages { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; }
.pg { flex: none; width: 150px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); overflow: hidden; }
.pg.dragging { opacity: .4; }
.pg.over { border-color: var(--accent); }
.pg .th { height: 190px; background: var(--panel-2) center/contain no-repeat; position: relative; cursor: grab; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.pg .th .no { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; border-radius: 5px; padding: 1px 6px; }
.pg .meta { padding: 6px 8px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.pg .tools { display: flex; border-top: 1px solid var(--line); }
.pg .tools button { flex: 1; border: 0; background: transparent; height: 28px; cursor: pointer; color: var(--fg-2); font-size: 11px; }
.pg .tools button:hover { background: var(--panel-2); color: var(--fg); }
.pg .tools button + button { border-left: 1px solid var(--line); }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.chain .arr { color: var(--muted); }
.res-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 18px; }
.res-tabs button { border: 0; background: transparent; padding: 11px 12px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.res-tabs button.on { color: var(--fg); font-weight: 600; border-color: var(--accent); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 640px; }
.ed-img { position: relative; overflow: auto; background: var(--panel-2); border-right: 1px solid var(--line); }
.ed-img .wrap { position: relative; margin: 12px auto; width: fit-content; }
.ed-img img { display: block; max-width: none; }
.ed-img svg { position: absolute; inset: 0; }
.ed-img rect { fill: transparent; stroke: transparent; stroke-width: 2; cursor: pointer; }
.ed-img rect.low { fill: rgba(245, 158, 11, .14); stroke: rgba(245, 158, 11, .7); }
.ed-img rect.on { fill: color-mix(in oklab, var(--accent) 20%, transparent); stroke: var(--accent); }
.ed-img .noimg { padding: 40px; color: var(--muted); text-align: center; }
.ed-lines { overflow: auto; padding: 8px 0; }
.ln { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; padding: 2px 12px; }
.ln .n { font: 11px var(--mono); color: var(--muted); text-align: right; }
.ln input { border: 1px solid transparent; border-radius: 5px; padding: 4px 6px; background: transparent; outline: none; width: 100%; font-size: 13.5px; }
.ln input:focus { border-color: var(--accent); background: var(--panel); }
.ln.low input { background: var(--warn-bg); }
.ln.edited input { box-shadow: inset 3px 0 0 var(--ok); }
.ln.on { background: var(--accent-weak); }
.ln .c { font: 11px var(--mono); color: var(--muted); text-align: right; }
.ln.low .c { color: var(--warn); font-weight: 600; }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.item.need { border-color: color-mix(in oklab, var(--warn) 55%, var(--line)); background: color-mix(in oklab, var(--warn) 5%, var(--panel)); }
.item-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.item-h .no { font-weight: 700; font-size: 15px; margin-right: 4px; }
.item .stem { font-size: 13.5px; }
.item .boogi { margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; color: var(--fg-2); white-space: pre-wrap; }
.item ol.ch { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 2px; }
.item ol.ch li { color: var(--fg-2); }
.set-h { font-size: 12.5px; color: var(--fg-2); padding: 8px 12px; background: var(--panel-2); border-radius: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hbar { display: grid; grid-template-columns: 90px 1fr 36px; align-items: center; gap: 10px; font-size: 12.5px; margin: 6px 0; }
.hbar .t { height: 10px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.hbar .f { height: 100%; background: var(--accent); border-radius: 999px; }
.hbar .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- 자료함 ---------- */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.lib .card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.lib .card h3 { font-size: 14px; }

/* ---------- 설정 ---------- */
.settings { display: grid; grid-template-columns: 200px minmax(0, 720px); gap: 32px; }
.settings > div:last-child { padding-bottom: 90px; }
.s-nav { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.s-nav a { padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--fg-2); }
.s-nav a.on { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.s-sec { margin-bottom: 36px; scroll-margin-top: 10px; }
.s-sec h2 { font-size: 18px; font-weight: 700; }
.s-sec > p { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
.s-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 280px); gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.s-row:last-child { border-bottom: 0; }
.s-row b { display: block; font-size: 13.5px; font-weight: 600; }
.s-row span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.s-row .ctl { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.s-row.changed b::after { content: "변경됨"; margin-left: 8px; font-size: 10.5px; color: var(--accent); font-weight: 600; }
.s-group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 18px; }
.savebar { position: sticky; bottom: 0; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); transform: translateY(120%); opacity: 0; transition: .2s; }
.savebar.show { transform: none; opacity: 1; }
.chain-list { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.chain-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; background: var(--panel); }
.chain-item .i { font: 11px var(--mono); color: var(--muted); width: 16px; }
.danger-zone { border-color: color-mix(in oklab, var(--bad) 40%, var(--line)); }

/* ---------- 주석 달기 ---------- */
.anno { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.anno-out { padding: 22px 26px; }
.anno-line { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(180px, 38%); gap: 14px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.anno-out.note .anno-line { grid-template-columns: 28px minmax(0, 1fr); }
.anno-line .ln-no { font: 11px var(--mono); color: var(--muted); padding-top: 5px; text-align: right; }
.anno-line .tx { font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", "바탕", "AppleMyungjo", serif; font-size: 16px; line-height: 2.1; }
.anno-line .notes { display: flex; flex-direction: column; gap: 4px; padding-top: 3px; }
.anno-out.note .anno-line .notes { grid-column: 2; padding-top: 0; }
mark.a { background: transparent; border-bottom: 2px solid; padding: 0 1px; cursor: pointer; color: inherit; }
mark.a.blank { color: transparent; border-bottom: 1.5px solid var(--fg); background: transparent; }
.note { font-size: 12px; line-height: 1.5; border-left: 3px solid; padding: 2px 8px; border-radius: 0 5px 5px 0; background: var(--panel-2); display: flex; gap: 6px; align-items: flex-start; }
.note .cat { font-weight: 700; white-space: nowrap; }
.note .txt { flex: 1; outline: none; }
.note .acts { display: none; gap: 2px; }
.note:hover .acts { display: flex; }

        log: (type, msg) => this.event(job, type, msg),
        cancelled: () => job.status === 'cancelled',
      };
      try {
        const r = await run(ctx);
        if (job.status !== 'cancelled') { job.status = job.needsReview ? 'needs_review' : 'completed'; job.progress = 100; job.result = r; job.stage = job.needsReview ? '검토 필요' : '완료'; this.event(job, 'completed', '완료'); if (Settings.get().notify.jobDone) toast(`${job.title}: 완료`); }
      } catch (e) {
        if (job.status !== 'cancelled') { job.status = 'failed'; job.error = { code: e.code || 'ERROR', message: e.message, retryable: !!e.retryable }; job.stage = '실패'; this.event(job, 'failed', e.message); toast(`${job.title}: ${e.message}`, 'bad'); console.error(e); }
      }
      job.finished_at = Date.now();
      this.running = false;
      this.emit();
      this.pump();
    },
    cancel(id) { const j = this.list.find((x) => x.id === id); if (j && ['queued', 'running'].includes(j.status)) { j.status = 'cancelled'; j.stage = '취소됨'; this.event(j, 'cancelled', '사용자가 취소'); } },
    event(job, type, msg) { job.events.push({ at: Date.now(), type, msg }); this.emit(); },
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
    emit() { for (const f of this.subs) try { f(); } catch (e) { console.error(e); } },
    get(id) { return this.list.find((j) => j.id === id); },
  };

  function renderJobs() {

    for (const j of Jobs.list) {

  // ---------- Gemini (설정에 키가 있을 때만 사용) ----------
  async function gemini(parts, { json = true, temperature = 0 } = {}) {
    const s = Settings.get();
    if (!s.ai.geminiKey) { const e = new Error('Gemini 키가 없습니다'); e.code = 'NO_KEY'; throw e; }
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(s.ai.model)}:generateContent?key=${encodeURIComponent(s.ai.geminiKey)}`;
    const body = { contents: [{ role: 'user', parts }], generationConfig: { temperature, ...(json ? { responseMimeType: 'application/json' } : {}) } };
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data?.error?.message || `Gemini 오류 ${r.status}`); e.code = 'GEMINI_HTTP_' + r.status; throw e; }
    const blocked = data?.promptFeedback?.blockReason;
    const cand = data?.candidates?.[0];
    const finishReason = blocked || cand?.finishReason || 'UNKNOWN';
    const text = (cand?.content?.parts || []).map((p) => p.text || '').join('');
    let parsed = null;
    if (json && text) { try { parsed = JSON.parse(text); } catch { parsed = null; } }
    return { finishReason, text, json: parsed };
  }
  // 응답 분류 (DB 함수 classify_ocr_outcome 과 동일 규칙)
  function classifyOutcome(finishReason, chars, expected) {
    const f = String(finishReason || '').toUpperCase();
    if (f === 'RECITATION') return 'blocked_copyright';
    if (['SAFETY', 'PROHIBITED_CONTENT', 'BLOCKLIST', 'SPII', 'OTHER'].includes(f)) return 'blocked_safety';
    if (!chars) return 'error';
    if (expected > 0 && chars < expected * 0.5) return 'truncated';
    return 'ok';
  }

  // ---------- 라우터 ----------
  const NAV = [
    { grp: '자료 만들기' },
    { id: 'annotate', label: '주석 달기', icon: 'note' },
    { id: 'textbook', label: '주석교재', icon: 'book' },
    { id: 'build', label: '시험지 제작', icon: 'layers' },
    { grp: '분석·보관' },
    { id: 'exam', label: '시험지 분석·저장', icon: 'scan' },

  // ---------- 작업 요청창 (Ctrl+K) ----------
  const COMMANDS = [
    { t: '시험지 분석·저장 열기', k: '시험지 분석 저장 ocr 텍스트화 구조화 업로드 이미지', run: () => go('exam') },

    { t: '자료함 열기', k: '자료함 저장 보관 목록', run: () => go('library') },
    { t: '설정: OCR 대체 순서', k: '설정 ocr 엔진 대체 저작권 차단 순서', run: () => go('settings', { s: 'ocr' }) },

    { t: '작업 큐 보기', k: '작업 큐 진행 상태 job', run: () => toggleDrawer(true) },

  ];
  function planFor(q) {
    const s = q.replace(/\s+/g, '');
    const steps = [];
    if (/ocr|텍스트|사진|이미지|pdf|스캔/i.test(s)) steps.push('시험지 분석·저장 → 텍스트화 모드로 파일 넣기');
    if (/분석|리포트|경향|동형/.test(s)) steps.push('시험지 분석·저장 → 분석 모드 (구조화 + 경향 리포트)');
    if (/주석|행간주|필기/.test(s)) steps.push('주석 달기 → 무료 사전 주석 → 필기량 조절');
    if (/변형|출제|시험지제작|설계도/.test(s)) steps.push('시험지 제작 → 설계도 만들기');
    if (/배너|디자인|표지|로고/.test(s)) steps.push('디자인 작업대 → 배너 슬롯 교체');
    return steps;
  }
  function openPalette() {
    if ($('.modal-bg')) return;
    let sel = 0, items = COMMANDS;
    const input = h('input', { placeholder: '무엇을 할까요? 예: "사진 시험지 텍스트화", "배너 바꾸기"', 'aria-label': '작업 요청' });
    const list = h('div', { class: 'list', role: 'listbox' });
    const plan = h('div', { class: 'plan hidden' });
    const bg = h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === bg) close(); } }, h('div', { class: 'palette', role: 'dialog', 'aria-label': '작업 요청창' }, input, list, plan));
    function close() { bg.remove(); }
    function draw() {
      const q = input.value.trim().toLowerCase();
      items = q ? COMMANDS.filter((c) => (c.t + ' ' + c.k).toLowerCase().split(/\s+/).some((w) => q.split(/\s+/).some((x) => w.includes(x) || x.includes(w)))) : COMMANDS;
      sel = Math.min(sel, Math.max(0, items.length - 1));
      list.innerHTML = '';
      items.forEach((c, i) => list.append(h('div', { class: 'it' + (i === sel ? ' on' : ''), role: 'option', onclick: () => { close(); c.run(); } }, c.t, h('small', null, i === sel ? 'Enter' : ''))));
      if (!items.length) list.append(h('div', { class: 'empty' }, '맞는 명령이 없어요.'));
      const steps = q ? planFor(q) : [];
      plan.classList.toggle('hidden', !steps.length);
      plan.innerHTML = steps.length ? '<b>에이전트 계획 (확인 후 실행)</b><ol>' + steps.map((s) => `<li>${esc(s)}</li>`).join('') + '</ol>' : '';
    }
    input.addEventListener('input', () => { sel = 0; draw(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && items[sel]) { close(); items[sel].run(); }
      else if (e.key === 'Escape') close();
    });
    document.body.append(bg);
    draw();
    input.focus();
  }

  // ---------- 테마 / 서랍 ----------
  function applyTheme() {
    const s = Settings.get();

  function toggleDrawer(force) { const d = $('#drawer'); d.classList.toggle('open', force ?? !d.classList.contains('open')); renderJobs(); }

  // ---------- 이미지 유틸 ----------
  function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('이미지를 읽을 수 없습니다')); i.src = src; }); }
  function readAs(file, how) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r[how](file); }); }
  async function imageStats(src) {
    const img = await loadImage(src);
    const c = document.createElement('canvas'); const w = 64, hh = Math.max(1, Math.round(64 * img.height / img.width));
    c.width = w; c.height = hh;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, hh);
    const d = g.getImageData(0, 0, w, hh).data;
    let lum = 0; const buckets = new Map();
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], gg = d[i + 1], b = d[i + 2];
      lum += (0.2126 * r + 0.7152 * gg + 0.0722 * b) / 255;
      const key = ((r >> 5) << 6) | ((gg >> 5) << 3) | (b >> 5);
      const e = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 }; e.n++; e.r += r; e.g += gg; e.b += b; buckets.set(key, e);
    }
    lum /= d.length / 4;
    const toHex = (v) => Math.round(v).toString(16).padStart(2, '0');
    const sorted = [...buckets.values()].sort((a, b) => b.n - a.n).map((e) => ({ r: e.r / e.n, g: e.g / e.n, b: e.b / e.n }));
    const pal = [];
    for (const c2 of sorted) {
      const sat = Math.max(c2.r, c2.g, c2.b) - Math.min(c2.r, c2.g, c2.b);
      if (sat < 40) continue; // 회색 계열 제외
      if (pal.some((p) => Math.abs(p.r - c2.r) + Math.abs(p.g - c2.g) + Math.abs(p.b - c2.b) < 90)) continue;
      pal.push(c2); if (pal.length === 3) break;
    }
    return { lum, palette: pal.map((p) => '#' + toHex(p.r) + toHex(p.g) + toHex(p.b)), width: img.width, height: img.height };
  }

  // ---------- 백업·복원 (서버가 붙기 전까지 자료를 잃지 않기 위한 필수 기능) ----------
  const STORES = ['documents', 'annotations', 'builds', 'assets'];
  const LS_KEYS = ['ks.settings', 'ks.settings.history', 'ks.design.presets'];
  const Backup = {
    lastKey: 'ks.lastBackup',
    last() { return +localStorage.getItem(this.lastKey) || 0; },
    async counts() { const o = {}; for (const s of STORES) o[s] = (await DB.all(s)).length; return o; },
    async export() {
      const data = { app: 'kor-studio', version: 1, exported_at: new Date().toISOString(), stores: {}, local: {} };
      for (const s of STORES) data.stores[s] = await DB.all(s);
      for (const k of LS_KEYS) data.local[k] = localStorage.getItem(k);
      if (data.local['ks.settings']) { try { const st = JSON.parse(data.local['ks.settings']); if (st.ai) st.ai.geminiKey = ''; data.local['ks.settings'] = JSON.stringify(st); } catch {} }
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      download(`국어스튜디오-백업-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`, JSON.stringify(data), 'application/json');
      localStorage.setItem(this.lastKey, String(Date.now()));
      const n = Object.values(data.stores).reduce((a, x) => a + x.length, 0);
      toast(`백업 파일을 내려받았어요 (자료 ${n}개, API 키는 빼고 저장)`);
      return n;
    },
    async restore(file) {
      let data;
      try { data = JSON.parse(await readAs(file, 'readAsText')); } catch { throw new Error('백업 파일을 읽을 수 없어요'); }
      if (data?.app !== 'kor-studio' || !data.stores) throw new Error('국어 스튜디오 백업 파일이 아니에요');
      let n = 0;
      for (const s of STORES) for (const obj of data.stores[s] || []) { if (obj && obj.id) { await DB.put(s, obj); n++; } }
      for (const k of LS_KEYS) {
        if (data.local?.[k] == null) continue;
        if (k === 'ks.settings') { // 지금 쓰는 API 키는 유지
          try { const cur = Settings.get(); const st = JSON.parse(data.local[k]); st.ai = { ...(st.ai || {}), geminiKey: cur.ai.geminiKey }; localStorage.setItem(k, JSON.stringify(st)); } catch {}
        } else localStorage.setItem(k, data.local[k]);
      }
      applyTheme();
      return n;
    },
    async wipe() { for (const s of STORES) await DB.clear(s); },
  };

  Object.assign(A, { Backup, $, $$, h, uid, esc, fmtDate, clone, sleep, deepMerge, toast, download, icon, DB, Settings, Jobs, gemini, classifyOutcome, ENGINE_LABEL, OUTCOME_LABEL, route, go, renderRoute, buildNav, openPalette, applyTheme, toggleTheme, toggleDrawer, renderJobs, loadImage, readAs, imageStats, NAV });
})(window.App);

<script>
/* 국어 스튜디오 - 입력 읽기, 전처리, OCR 엔진과 대체 순서 */
(function (A) {
  'use strict';
  const MAX_DIM = 2400;
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const err = (msg, code) => Object.assign(new Error(msg), { code });
  const textToLines = (text) => text.split(/\r?\n/).map((t) => t.replace(/\s+$/, '')).filter((t) => t.trim()).map((t, i) => ({ line_no: i + 1, text: t, bbox: null, confidence: null, status: 'ok' }));

  async function canvasFrom(src, w, hgt) {
    const img = await A.loadImage(src);
    const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round((w || img.width) * scale); c.height = Math.round((hgt || img.height) * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  // ---------- 파일 → 쪽 ----------
  async function imagePage(blob, fname) {
    const url = URL.createObjectURL(blob);
    try {
      const c = await canvasFrom(url);
      return { id: A.uid('pg_'), fname, kind: 'image', src: c.toDataURL('image/jpeg', 0.92), width: c.width, height: c.height };
    } finally { URL.revokeObjectURL(url); }
  }

  async function hwpxPages(file) {
    if (!window.JSZip) throw err('HWPX 읽기 모듈을 불러오지 못했습니다', 'LIB');
    const zip = await JSZip.loadAsync(file);
    const names = Object.keys(zip.files).filter((n) => /^Contents\/section\d+\.xml$/i.test(n)).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
    if (!names.length) throw err('HWPX 본문(section)을 찾지 못했습니다', 'HWPX_EMPTY');
    const lines = [];
    for (const n of names) {
      const xml = new DOMParser().parseFromString(await zip.file(n).async('string'), 'application/xml');
      for (const p of xml.getElementsByTagNameNS('*', 'p')) {
        if (p.parentElement && p.parentElement.localName === 'p') continue;
        const t = [...p.getElementsByTagNameNS('*', 't')].map((x) => x.textContent).join('');
        if (t.trim()) lines.push(t);
      }
    }
    return [{ id: A.uid('pg_'), fname: file.name, kind: 'parsed', src: null, lines: textToLines(lines.join('\n')) }];
  }

  // PDF: 글자 레이어가 있으면 그대로 쓰고(무료), 없으면 그림으로 렌더링해서 OCR 대상
  async function pdfPages(file, onProgress) {
    if (!window.pdfjsLib) throw err('PDF 모듈을 불러오지 못했습니다', 'LIB');
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const out = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 2 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const tc = await page.getTextContent();
      const items = tc.items.filter((it) => it.str && it.str.trim());
      const chars = items.reduce((s, it) => s + it.str.replace(/\s/g, '').length, 0);
      const pg = { id: A.uid('pg_'), fname: `${file.name} ${i}쪽`, src: c.toDataURL('image/jpeg', 0.9), width: c.width, height: c.height };
      if (chars >= 40) { pg.kind = 'pdf_text'; pg.lines = pdfLines(items, vp); }
      else pg.kind = 'pdf_scan';
      out.push(pg);
      onProgress && onProgress(i, pdf.numPages);
    }
    return out;
  }
  function pdfLines(items, vp) {
    const boxes = items.map((it) => {
      const t = pdfjsLib.Util.transform(vp.transform, it.transform);
      const hgt = Math.hypot(t[2], t[3]);
      return { str: it.str, x: t[4], y: t[5] - hgt, w: it.width * vp.scale, h: hgt };
    });
    const mid = vp.width / 2;
    const crossing = boxes.filter((b) => b.x < mid - 4 && b.x + b.w > mid + 4).length;
    const twoCol = crossing / boxes.length < 0.04 && boxes.some((b) => b.x > mid) && boxes.some((b) => b.x + b.w < mid);
    const groups = [];
    for (const b of boxes) {
      const col = twoCol ? (b.x >= mid ? 1 : 0) : 0;
      const g = groups.find((g) => g.col === col && Math.abs(g.y - b.y) < Math.max(3, b.h * 0.5));
      if (g) g.items.push(b); else groups.push({ col, y: b.y, items: [b] });
    }
    groups.sort((a, b) => a.col - b.col || a.y - b.y);
    return groups.map((g, i) => {
      g.items.sort((a, b) => a.x - b.x);
      let text = '';
      g.items.forEach((b, k) => { if (k) { const p = g.items[k - 1]; text += b.x - (p.x + p.w) > b.h * 0.25 ? ' ' : ''; } text += b.str; });
      const x0 = Math.min(...g.items.map((b) => b.x)), y0 = Math.min(...g.items.map((b) => b.y));
      const x1 = Math.max(...g.items.map((b) => b.x + b.w)), y1 = Math.max(...g.items.map((b) => b.y + b.h));
      return { line_no: i + 1, text: text.trim(), bbox: [Math.round(x0), Math.round(y0), Math.round(x1 - x0), Math.round(y1 - y0)], confidence: 100, status: 'ok' };
    }).filter((l) => l.text);
  }

  async function fileToPages(file, onProgress) {
    const name = (file.name || 'clipboard.png').toLowerCase();
    const ext = name.includes('.') ? name.split('.').pop() : '';
    if (ext === 'txt' || file.type === 'text/plain') return [{ id: A.uid('pg_'), fname: file.name, kind: 'parsed', src: null, lines: textToLines(await A.readAs(file, 'readAsText')) }];
    if (ext === 'hwpx') return hwpxPages(file);
    if (ext === 'hwp') throw err('HWP(구버전 바이너리)는 서버 파서 단계에서 지원합니다. 한글에서 HWPX나 PDF로 저장해 올려 주세요.', 'HWP_BINARY');
    if (ext === 'pdf' || file.type === 'application/pdf') return pdfPages(file, onProgress);
    if (['heic', 'heif'].includes(ext) || /hei[cf]/.test(file.type)) {
      if (!window.heic2any) throw err('HEIC 변환 모듈을 불러오지 못했습니다', 'LIB');
      const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
      return [await imagePage(Array.isArray(out) ? out[0] : out, file.name)];
    }
    if ((file.type || '').startsWith('image/') || ['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'].includes(ext)) return [await imagePage(file, file.name || '붙여넣은 이미지')];
    throw err(`지원하지 않는 형식입니다: ${file.name}`, 'UNSUPPORTED');
  }

  // ---------- 전처리 ----------
  async function rotate(page, deg) {
    const img = await A.loadImage(page.src);
    const rad = deg * Math.PI / 180, s = Math.abs(Math.sin(rad)), co = Math.abs(Math.cos(rad));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * co + img.height * s); c.height = Math.round(img.width * s + img.height * co);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.translate(c.width / 2, c.height / 2); g.rotate(rad); g.drawImage(img, -img.width / 2, -img.height / 2);
    return { ...page, src: c.toDataURL('image/jpeg', 0.92), width: c.width, height: c.height, lines: page.kind === 'pdf_text' ? null : page.lines, kind: page.kind === 'pdf_text' ? 'pdf_scan' : page.kind };
  }
  async function split(page) {
    const img = await A.loadImage(page.src);
    const half = Math.floor(img.width / 2);
    const mk = (x, label) => {
      const c = document.createElement('canvas'); c.width = half; c.height = img.height;
      c.getContext('2d').drawImage(img, x, 0, half, img.height, 0, 0, half, img.height);
      return { id: A.uid('pg_'), fname: `${page.fname} (${label})`, kind: page.kind === 'pdf_text' ? 'pdf_scan' : page.kind, src: c.toDataURL('image/jpeg', 0.92), width: half, height: img.height };
    };
    return [mk(0, '왼쪽'), mk(half, '오른쪽')];
  }
  // 회색조 + 명암 늘리기 (2%~98% 구간)
  async function enhance(src) {
    const c = await canvasFrom(src);
    const g = c.getContext('2d');
    const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
    const hist = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) { const y = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0; d[i] = y; hist[y]++; }
    const total = d.length / 4; let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > total * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > total * 0.02) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0; i < d.length; i += 4) { const v = Math.max(0, Math.min(255, (d[i] - lo) * 255 / span)); d[i] = d[i + 1] = d[i + 2] = v; }
    g.putImageData(im, 0, 0);
    return c.toDataURL('image/jpeg', 0.92);
  }

  // ---------- 엔진 ----------
  let worker = null, workerLang = null, logFn = null;
  async function getWorker(lang, ctx) {
    if (!window.Tesseract) throw err('OCR 엔진을 불러오지 못했습니다(네트워크 확인)', 'LIB');
    if (worker && workerLang === lang) return worker;
    if (worker) { await worker.terminate(); worker = null; }
    ctx && ctx.log('info', `전용 OCR 언어 데이터 준비 (${lang}) · 처음 한 번만 내려받아요`);
    worker = await Tesseract.createWorker(lang, 1, { logger: (m) => logFn && logFn(m) });
    workerLang = lang;
    return worker;
  }
  function tessLines(data, dx, lowConf) {
    return (data.lines || []).map((l) => ({
      text: (l.text || '').replace(/\s+$/, '').replace(/\n/g, ''),
      bbox: [Math.round(l.bbox.x0 + dx), Math.round(l.bbox.y0), Math.round(l.bbox.x1 - l.bbox.x0), Math.round(l.bbox.y1 - l.bbox.y0)],
      confidence: Math.round(l.confidence),
    })).filter((l) => l.text.trim()).map((l) => ({ ...l, status: l.confidence < lowConf ? 'low_conf' : 'ok' }));
  }
  const judge = (lines) => {
    const chars = lines.reduce((s, l) => s + l.text.replace(/\s/g, '').length, 0);
    const mean = lines.length ? lines.reduce((s, l) => s + (l.confidence || 0), 0) / lines.length : 0;
    return { chars, mean, outcome: chars < 8 ? 'error' : mean < 45 ? 'low_quality' : 'ok' };
  };

  const Engines = {
    // 1) Gemini 판독: 키가 있을 때만. 저작권 차단(RECITATION)이면 다음 엔진으로
    async gemini(page) {
      const b64 = page.src.split(',')[1];
      const mime = page.src.slice(5, page.src.indexOf(';'));
      const prompt = '이 시험지 이미지의 글자를 위에서 아래, 왼쪽 단에서 오른쪽 단 순서로 줄 단위로 옮겨라. 고치거나 요약하지 말 것. JSON {"lines":["…"]} 형식으로만 답하라.';
      const r = await A.gemini([{ text: prompt }, { inline_data: { mime_type: mime, data: b64 } }]);
      const arr = Array.isArray(r.json?.lines) ? r.json.lines.map((x) => (typeof x === 'string' ? x : x?.text || '')) : [];
      const chars = arr.join('').replace(/\s/g, '').length;
      return { outcome: A.classifyOutcome(r.finishReason, chars, page.expectedChars || 0), finishReason: r.finishReason, lines: arr.filter((t) => t.trim()).map((t) => ({ text: t, bbox: null, confidence: null, status: 'ok' })) };
    },
    // 2) 전용 OCR: 줄 단위 글자 + 좌표 + 신뢰도 (시연판은 브라우저 안 Tesseract, 서비스에서는 Upstage/CLOVA로 교체)
    async dedicated_ocr(page, ctx, s) {
      const w = await getWorker(s.ocr.lang, ctx);
      const { data } = await w.recognize(page.src);
      const lines = tessLines(data, 0, s.ocr.lowConf);
      return { ...judge(lines), lines };
    },
    // 3) 타일 모드: 쪽을 왼쪽·오른쪽 단으로 잘라 따로 인식 (2단 시험지, 긴 출력 차단 대응)
    async tile_mode(page, ctx, s) {
      const w = await getWorker(s.ocr.lang, ctx);
      const img = await A.loadImage(page.src);
      const half = Math.floor(img.width / 2);
      let lines = [];
      for (const x of [0, half]) {
        const c = document.createElement('canvas'); c.width = half; c.height = img.height;
        c.getContext('2d').drawImage(img, x, 0, half, img.height, 0, 0, half, img.height);
        const { data } = await w.recognize(c.toDataURL('image/png'));
        lines = lines.concat(tessLines(data, x, s.ocr.lowConf));
      }
      return { ...judge(lines), lines };
    },
    // 4) 수동 확인: 가장 나았던 결과를 '의심'으로 표시해 교정 화면으로 넘김
    async manual(page) {
      const best = page.bestLines || [];
      if (!best.length) return { outcome: 'ok', manual: true, lines: [{ text: '', bbox: null, confidence: 0, status: 'unreadable' }] };
      return { outcome: 'ok', manual: true, lines: best.map((l) => ({ ...l, status: 'low_conf' })) };
    },
  };

  async function prepare(page, s, i) {
    const p = { page_no: i + 1, fname: page.fname, kind: page.kind, src: page.src, width: page.width, height: page.height, lines: page.lines ? A.clone(page.lines) : null, attempts: [], fallback_path: [] };
    if (p.src && s.ocr.enhance && (p.kind === 'image' || p.kind === 'pdf_scan')) p.src = await enhance(p.src);
    return p;
  }

  // 쪽 하나에 대체 순서 적용 (DB 함수 next_ocr_engine 과 같은 규칙)
  async function recognizePage(p, ctx, s) {
    const tag = `${p.page_no}쪽`;
    if (p.kind === 'pdf_text' || p.kind === 'parsed') {
      p.text_source = p.kind; p.final_engine = p.kind; p.fallback_path = [p.kind + ':ok'];
      ctx.log('info', `${tag}: ${A.ENGINE_LABEL[p.kind]} → OCR 없이 바로 사용 (비용 0)`);
    } else {
      p.text_source = 'ocr';
      const chain = s.ocr.chain.filter((e) => !s.ocr.disabled.includes(e)).filter((e) => e !== 'gemini' || s.ai.geminiKey);
      if (!s.ai.geminiKey && s.ocr.chain.includes('gemini') && !s.ocr.disabled.includes('gemini')) p.fallback_path.push('gemini:skipped');
      for (const eng of chain) {
        if (ctx.cancelled()) throw err('취소됨', 'CANCELLED');
        ctx.log('stage', `${tag}: ${A.ENGINE_LABEL[eng]} 시도`);
        logFn = (m) => { if (m.status === 'recognizing text') ctx.progress(ctx.job.progress); };
        const t0 = performance.now();
        let r;
        try { r = await Engines[eng](p, ctx, s); } catch (e) { r = { outcome: 'error', error: e.message, lines: [] }; }
        const ms = Math.round(performance.now() - t0);
        p.attempts.push({ engine: eng, outcome: r.outcome, finish_reason: r.finishReason || null, chars: r.chars ?? null, mean_conf: r.mean != null ? Math.round(r.mean) : null, duration_ms: ms });
        p.fallback_path.push(eng + ':' + r.outcome);
        if (r.lines && r.lines.length && (!p.bestLines || (r.mean || 0) > (p.bestMean || 0))) { p.bestLines = r.lines; p.bestMean = r.mean || 0; }
        if (r.outcome === 'ok') {
          p.lines = r.lines; p.final_engine = eng; p.manual = !!r.manual;
          ctx.log(r.manual ? 'fallback' : 'info', `${tag}: ${A.ENGINE_LABEL[eng]} ${r.manual ? '→ 교정 화면에서 확인 필요' : '완료'} (${(ms / 1000).toFixed(1)}초)`);
          break;
        }
        ctx.log('fallback', `${tag}: ${A.ENGINE_LABEL[eng]} ${A.OUTCOME_LABEL[r.outcome]}${r.error ? ' (' + r.error + ')' : ''}${r.mean != null ? ` · 평균 신뢰도 ${Math.round(r.mean)}` : ''} → 다음 엔진`);
      }
      if (!p.lines) { p.lines = [{ text: '', bbox: null, confidence: 0, status: 'unreadable' }]; p.final_engine = 'manual'; }
      delete p.bestLines; delete p.bestMean;
    }
    p.lines = p.lines.map((l, i) => {
      let status = l.status === 'ok' && l.confidence != null && l.confidence < s.ocr.lowConf ? 'low_conf' : l.status;
      // 한글 줄에 뜨금없는 영문 조각(예: "Ho]", "AME")이 섞이면 오독 의심
      const body = (l.text || '').replace(/\[[^\]]*\]/g, '');
      const hangul = (body.match(/[가-힣]/g) || []).length;
      if (status === 'ok' && p.text_source === 'ocr' && hangul >= 4 && /[A-Za-z]{2,}|[A-Za-z][\]\}|]/.test(body)) { status = 'low_conf'; l.reason = '한글 사이 영문 조각'; }
      return { ...l, line_no: i + 1, gid: `P${p.page_no}-L${i + 1}`, status };
    });
    const confs = p.lines.map((l) => l.confidence).filter((c) => c != null);
    p.confidence = confs.length ? Math.round(confs.reduce((a, b) => a + b, 0) / confs.length) : null;
    p.suspect_count = p.lines.filter((l) => l.status === 'low_conf' || l.status === 'unreadable').length;
  }

  A.ocr = { fileToPages, rotate, split, enhance, prepare, recognizePage, Engines, textToLines };
})(window.App);

</script>
<script>
/* 국어 스튜디오 - 구조화(참조형 AI / 규칙 기반)와 시험지 분석 */
(function (A) {
  'use strict';

  const DOMAIN = { READING: '독서', POETRY: '문학(운문)', NOVEL: '문학(산문)', SPEECH_WRITING: '화법과 작문', GRAMMAR: '문법', MEDIA: '매체', UNKNOWN: '미분류' };
  const TYPE = { FACT: '내용 일치', INFER: '세부 추론', APPLY: '<보기> 적용', VOCAB: '어휘·문맥적 의미', STRUCT: '서술 방식·전개', EXPR: '표현상 특징', CHAR: '인물·심리·태도', COMPARE: '작품·관점 비교', CRIT: '비판·감상', GRAM: '문법 탐구', MEDIA: '매체 자료', SPEECH: '화법 전략', WRITE: '작문·고쳐쓰기' };
  const DOMAIN_RULES = [
    ['GRAMMAR', /(음운|음절|형태소|품사|어근|접사|어간|어미|문장 성분|높임|피동|사동|중세 국어|국어사|안은문장|이어진문장|용언|체언|조사|음운 변동|표준 발음|단어의 짜임)/g, 3],
    ['MEDIA', /(매체|화면|게시물|누리집|블로그|영상|댓글|카드 뉴스|인터넷 방송|하이퍼링크)/g, 3],
    ['SPEECH_WRITING', /(발표|토론|대화|강연|협상|면담|초고|고쳐 쓰|글쓰기|작문|청중|발표자|토의|연설)/g, 2],
    ['POETRY', /(화자|시어|시상|시적|운율|시구|청자|[0-9]연|시의)/g, 3],
    ['NOVEL', /(서술자|인물|사건|장면|갈등|서사|등장인물|이야기)/g, 2],
    ['READING', /(윗글|글쓴이|견해|이론|개념|원리|입장|학자|과정|원인|정보)/g, 1],
  ];
  const TYPE_RULES = [
    ['VOCAB', /(문맥적 의미|사전적 의미|바꿔 쓰|바꾸어 쓰|의미로 적절|ⓐ\s*~\s*ⓔ)/],
    ['GRAM', /(음운|형태소|품사|문장 성분|높임|피동|사동|중세 국어|어미|조사|단어의 짜임)/],
    ['MEDIA', /(매체|화면|게시물|영상|누리집)/],
    ['SPEECH', /(발표|말하기|강연|토론|대화|면담|협상)/],
    ['WRITE', /(초고|고쳐 쓰|글쓰기|작문|자료 활용|조건에 따라)/],
    ['COMPARE', /(\(가\)\s*와\s*\(나\)|\(가\)\s*~\s*\(다\)|공통점|차이점|비교)/],
    ['EXPR', /(표현상|표현 방식|표현 효과|표현한)/],
    ['STRUCT', /(서술상|서술 방식|전개 방식|글의 구조|서술 특징|짜임)/],
    ['CHAR', /(인물|심리|태도|정서|화자)/],
    ['CRIT', /(비판|반응|감상|평가)/],
    ['INFER', /(추론|짐작|예측|이유|까닭)/],
    ['FACT', /(일치|알 수 있는|이해한 내용|이해로|설명으로|내용으로)/],
  ];
  const NEG = /(적절하지\s*않은|않(?:은|는)\s*것은|옳지\s*않은|틀린\s*것|거리가\s*먼)/;
  // OCR이 ①~⑤를 잘못 읽은 표식 (@, @), ®, ©, 6), (1), 1) 등). 문항 안에서는 나오는 순서대로 선지 번호를 매김
  const reOcrMark = /^\s*(?:[@®©◎○⓪⑥](?:\)|\s)|[@®©]$|\(?[1-6]\)\s|[①-⑤]\s?)/;
  const CH = ['①', '②', '③', '④', '⑤'];
  const reSet = /^\s*[\[［]\s*(\d{1,2})\s*[~∼～\-–]\s*(\d{1,2})\s*[\]］]/;
  const reQ = /^\s*(\d{1,2})\s*[.．]\s*(\S.*)$/;
  const reBoogi = /[<〈＜《\[]\s*보\s*기\s*[>〉＞》\]]/;

  function flatLines(doc) {
    const out = [];
    for (const p of doc.pages) for (const l of p.lines || []) out.push({ gid: l.gid, page: p.page_no, text: l.text || '', status: l.status });
    return out;
  }

  // ---------- 규칙 기반 구조화 ----------
  function ruleStructure(lines) {
    const sets = [], items = [], preamble = [];
    let set = null, cur = null, part = null;
    const lastNo = () => (items.length ? items[items.length - 1].number : null);
    for (const L of lines) {
      const t = L.text.trim();
      if (!t) continue;
      const ms = t.match(reSet);
      if (ms) { set = { from: +ms[1], to: +ms[2], header: t, refs: [L.gid], passage: '', passage_refs: [] }; sets.push(set); cur = null; part = 'passage'; continue; }
      const mq = t.match(reQ);
      if (mq) {
        const n = +mq[1], prev = lastNo();
        const seqOk = prev == null ? n <= 45 : n > prev && n - prev <= 3;
        if (seqOk && !CH.some((c) => mq[2].startsWith(c))) {
          cur = { number: n, set: set ? sets.indexOf(set) : null, stem: mq[2], stem_refs: [L.gid], boogi: '', boogi_refs: [], choices: {}, choice_refs: {}, seq_ok: prev == null || n === prev + 1 };
          items.push(cur); part = 'stem';
          continue;
        }
      }
      const marks = CH.map((c, i) => ({ i: i + 1, at: t.indexOf(c) })).filter((m) => m.at >= 0).sort((a, b) => a.at - b.at);
      const digitMark = /^\s*\(?[1-6]\)\s/.test(t);
      if (cur && marks.length <= 1 && part !== 'passage' && reOcrMark.test(t) && !(digitMark && part === 'boogi')) {
        const k = Object.keys(cur.choices).length + 1;
        if (k <= 5) {
          part = 'choices';
          cur.choices[k] = t.replace(reOcrMark, '').trim();
          cur.choice_refs[k] = [L.gid];
          cur.ocr_marks = true;
          continue;
        }
      }
      if (cur && marks.length) {
        part = 'choices';
        marks.forEach((m, k) => {
          const seg = t.slice(m.at + 1, k + 1 < marks.length ? marks[k + 1].at : undefined).trim();
          cur.choices[m.i] = ((cur.choices[m.i] || '') + ' ' + seg).trim();
          (cur.choice_refs[m.i] = cur.choice_refs[m.i] || []).push(L.gid);
        });
        const pre = t.slice(0, marks[0].at).trim();
        if (pre && marks[0].i === 1) { cur.stem += ' ' + pre; cur.stem_refs.push(L.gid); }
        continue;
      }
      const bm = t.match(reBoogi);
      const boogiStart = bm && (t.length - bm[0].length <= 2 || (bm.index === 0 && !/^[를을에의와는가]/.test(t.slice(bm[0].length).trim())));
      if (cur && boogiStart) { part = 'boogi'; const rest = t.replace(reBoogi, '').trim(); if (rest) cur.boogi += (cur.boogi ? '\n' : '') + rest; cur.boogi_refs.push(L.gid); continue; }
      if (cur && part === 'stem') { cur.stem += ' ' + t; cur.stem_refs.push(L.gid); continue; }
      if (cur && part === 'boogi') { cur.boogi += (cur.boogi ? '\n' : '') + t; cur.boogi_refs.push(L.gid); continue; }
      if (cur && part === 'choices') {
        const filled = Object.keys(cur.choices).length;
        if (filled < 5) { const k = Math.max(...Object.keys(cur.choices).map(Number)); cur.choices[k] += ' ' + t; cur.choice_refs[k].push(L.gid); continue; }
        // 선지 5개를 다 채운 뒤 나오는 글 = 다음 지문 (머리말 없는 지문)
        set = { from: null, to: null, header: '', refs: [], passage: t, passage_refs: [L.gid], implicit: true }; sets.push(set); cur = null; part = 'passage'; continue;
      }
      if (set && part === 'passage') { set.passage += (set.passage ? '\n' : '') + t; set.passage_refs.push(L.gid); continue; }
      preamble.push(t);
    }
    return { sets, items, preamble };
  }

  // ---------- 분류 ----------
  function classifyDomain(text) {
    let best = 'READING', bestScore = 0;
    for (const [d, re, w] of DOMAIN_RULES) { const n = (text.match(re) || []).length * w; if (n > bestScore) { best = d; bestScore = n; } }
    return best;
  }
  function classifyType(item, domain) {
    const s = item.stem || '';
    if (/(문맥적 의미|사전적 의미|바꿔 쓰|바꾸어 쓰)/.test(s)) return 'VOCAB';
    if (domain === 'GRAMMAR') return 'GRAM';
    if (item.boogi || reBoogi.test(s)) return 'APPLY';
    for (const [t, re] of TYPE_RULES) if (re.test(s)) return t;
    return 'FACT';
  }
  function enrich(st, lines) {
    const low = new Set(lines.filter((l) => l.status === 'low_conf' || l.status === 'unreadable').map((l) => l.gid));
    // 같은 지문을 쓰는 문항은 같은 영역: 지문 + 모든 발문을 합쳐 한 번에 판단
    st.sets.forEach((s, si) => {
      const its = st.items.filter((i) => i.set === si);
      s.domain = classifyDomain(`${its.map((i) => i.stem + ' ' + i.stem + ' ' + i.boogi).join(' ')} ${(s.header || '')} ${s.passage.slice(0, 600)}`);
      if (/다음\s*시/.test(s.header || '')) s.domain = 'POETRY';
      if (/다음\s*(글|소설)/.test(s.header || '') && /(서술자|인물|사건)/.test(its.map((i) => i.stem).join(' '))) s.domain = 'NOVEL';
    });
    for (const it of st.items) {
      const ctxText = `${it.stem} ${it.stem} ${it.boogi} ${it.set != null ? (st.sets[it.set]?.passage || '').slice(0, 500) : ''}`;
      it.domain = it.domain || (it.set != null && st.sets[it.set]?.domain) || classifyDomain(ctxText);
      it.item_type = it.item_type || classifyType(it, it.domain);
      it.negative = NEG.test(it.stem);
      const nCh = Object.keys(it.choices).length;
      const refs = [...it.stem_refs, ...it.boogi_refs, ...Object.values(it.choice_refs).flat()];
      const lowHit = refs.some((g) => low.has(g));
      it.confidence = +(0.35 * (it.stem.length >= 8 ? 1 : 0) + 0.4 * Math.min(nCh, 5) / 5 + 0.15 * (it.seq_ok === false ? 0 : 1) + 0.1 * (lowHit ? 0 : 1)).toFixed(2);
      it.needs_review = it.confidence < 0.65;
      it.teacher_confirmed = it.teacher_confirmed || false;
      it.choice_avg_len = nCh ? Math.round(Object.values(it.choices).reduce((a, c) => a + c.length, 0) / nCh) : 0;
    }
    return st;
  }

  // ---------- 참조형 구조화 (AI는 줄 ID만 답함 → 원문 재출력 없음) ----------
  async function referenceStructure(lines) {
    const listing = lines.slice(0, 1500).map((l) => `${l.gid}: ${l.text}`).join('\n');
    const prompt = `다음은 OCR로 읽은 국어 시험지의 줄 목록이다. 각 줄 앞에 줄 ID가 있다.
시험지 구조를 줄 ID로만 답하라. 원문 글자를 다시 쓰지 마라.
JSON 형식: {"sets":[{"from":18,"to":21,"header_ref":"P1-L3","passage_refs":["P1-L4"]}],
"items":[{"number":18,"stem_refs":["P1-L20"],"boogi_refs":[],"choice_refs":{"1":["P1-L22"],"2":[],"3":[],"4":[],"5":[]},
"domain":"READING|POETRY|NOVEL|SPEECH_WRITING|GRAMMAR|MEDIA","item_type":"FACT|INFER|APPLY|VOCAB|STRUCT|EXPR|CHAR|COMPARE|CRIT|GRAM|MEDIA|SPEECH|WRITE"}]}
줄 목록:
${listing}`;
    const r = await A.gemini([{ text: prompt }]);
    const j = r.json;
    if (A.classifyOutcome(r.finishReason, (r.text || '').length, 0) !== 'ok' || !j || !Array.isArray(j.items) || !j.items.length) {
      const e = new Error(`참조형 구조화 실패 (${r.finishReason}${j ? '' : ', JSON 아님'})`); e.code = 'REFERENCE_FAILED'; throw e;
    }
    const byId = new Map(lines.map((l) => [l.gid, l.text]));
    const txt = (refs) => (refs || []).map((g) => byId.get(g) || '').join(' ').replace(/\s+/g, ' ').trim();
    const strip = (s) => s.replace(/^\s*\d{1,2}\s*[.．]\s*/, '').replace(/^[①②③④⑤]\s*/, '').replace(reBoogi, '').trim();
    const sets = (j.sets || []).map((s) => ({ from: s.from, to: s.to, header: byId.get(s.header_ref) || '', refs: s.header_ref ? [s.header_ref] : [], passage: (s.passage_refs || []).map((g) => byId.get(g) || '').join('\n'), passage_refs: s.passage_refs || [] }));
    const items = j.items.map((it) => {
      const choices = {}, choice_refs = {};
      for (const k of ['1', '2', '3', '4', '5']) { const refs = it.choice_refs?.[k] || []; if (refs.length) { choices[k] = strip(txt(refs)); choice_refs[k] = refs; } }
      const set = sets.findIndex((s) => s.from != null && it.number >= s.from && it.number <= s.to);
      return { number: it.number, set: set >= 0 ? set : null, stem: strip(txt(it.stem_refs)), stem_refs: it.stem_refs || [], boogi: strip(txt(it.boogi_refs)), boogi_refs: it.boogi_refs || [], choices, choice_refs, domain: DOMAIN[it.domain] ? it.domain : null, item_type: TYPE[it.item_type] ? it.item_type : null, seq_ok: true };
    });
    return { sets, items, preamble: [] };
  }

  async function run(doc, ctx, s) {
    const lines = flatLines(doc);
    const chain = s.structure || s.ocr.structure;
    for (const eng of chain) {
      if (eng === 'reference_mode') {
        if (!s.ai.geminiKey) { ctx.log('info', '구조화: 참조형(AI)은 Gemini 키가 없어 건너뜀 → 규칙 기반'); continue; }
        try { ctx.log('stage', '구조화: 참조형(AI, 줄 ID만 응답) 시도'); const st = enrich(await referenceStructure(lines), lines); st.engine = 'reference_mode'; ctx.log('info', `구조화 완료: ${st.items.length}문항 (참조형)`); return st; }
        catch (e) { ctx.log('fallback', `구조화: ${e.message} → 규칙 기반으로 전환`); }
      }
      if (eng === 'rule_based') { const st = enrich(ruleStructure(lines), lines); st.engine = 'rule_based'; ctx.log('info', `구조화 완료: ${st.items.length}문항 (규칙 기반)`); return st; }
    }
    const st = enrich(ruleStructure(lines), lines); st.engine = 'rule_based'; return st;
  }
  function rebuild(doc) { const lines = flatLines(doc); const st = enrich(ruleStructure(lines), lines); st.engine = 'rule_based'; return st; }

  // ---------- 분석 리포트 ----------
  function analyze(doc) {
    const items = doc.structure?.items || [];
    const n = items.length;
    const count = (f) => items.filter(f).length;
    const dist = (key, names) => {
      const m = {}; for (const it of items) m[it[key]] = (m[it[key]] || 0) + 1;
      return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ key: k, label: names[k] || k, n: v, pct: n ? Math.round(v * 100 / n) : 0 }));
    };
    const domains = dist('domain', DOMAIN), types = dist('item_type', TYPE);
    const neg = count((i) => i.negative), boogi = count((i) => i.item_type === 'APPLY'), review = count((i) => i.needs_review && !i.teacher_confirmed);
    const top = domains[0];
    const tips = {
      READING: '독서는 문단별 핵심 정보 정리와 선지-지문 대조 훈련이 우선입니다.',
      POETRY: '운문은 화자의 정서·태도와 표현법 개념어를 정확히 연결하는 연습이 필요합니다.',
      NOVEL: '산문은 인물 관계와 사건 흐름을 요약하고, 서술상 특징 선지를 판단하는 연습이 필요합니다.',
      GRAMMAR: '문법은 개념 정리 후 자료 적용 문제를 반복해야 합니다.',
      SPEECH_WRITING: '화법과 작문은 말하기 전략·글쓰기 계획을 자료와 대조하는 유형이 중심입니다.',
      MEDIA: '매체는 자료의 표현 방식과 수용자 고려 요소를 묻는 문항이 중심입니다.',
    };
    const summary = n ? [
      `이번 시험지는 총 ${n}문항으로 분석되었습니다. 가장 비중이 큰 영역은 ${top.label}(${top.n}문항, ${top.pct}%)입니다.`,
      `'적절하지 않은 것'을 고르는 부정 발문이 ${neg}문항(${Math.round(neg * 100 / n)}%)으로, 선지 하나하나를 근거와 대조하는 습관이 점수를 좌우합니다.`,
      boogi ? `<보기>를 적용하는 문항이 ${boogi}문항 있어, 외부 자료를 지문에 대입하는 연습이 필요합니다.` : '<보기> 적용 문항은 거의 없었습니다.',
      ...domains.slice(0, 3).map((d) => tips[d.key]).filter(Boolean),
    ] : ['문항을 찾지 못했습니다. 교정 화면에서 문항 번호(예: "12.")와 선지 기호(①~⑤)가 제대로 읽혔는지 확인해 주세요.'];
    return { n, domains, types, neg, boogi, review, summary, created_at: Date.now() };
  }

  A.structure = { run, rebuild, analyze, ruleStructure, DOMAIN, TYPE, CH };
})(window.App);

</script>
<script>
/* 국어 스튜디오 - 시험지 분석·저장 (요청 5 + 7) */
(function (A) {
  'use strict';
  const { h, esc, icon } = A;
  const MODES = [
    { id: 'text', name: '텍스트화', desc: '글자만 읽어 교정하고 TXT로 받기' },
    { id: 'structure', name: '구조화', desc: '글자를 문항·<보기>·선지로 나누기' },
    { id: 'analyze', name: '분석', desc: '구조화에 더해 출제 경향 리포트까지' },
  ];
  const ROLES = ['시험지', '학교프린트', '교사용교과서', '자습서', '평가문제집', '기출', '수업필기', '기타'];
  const KIND_LABEL = { image: '이미지', pdf_text: 'PDF 글자', pdf_scan: 'PDF 스캔', parsed: '텍스트' };
  const S = A.examState = A.examState || { mode: 'analyze', title: '', role: '시험지', pages: [], doc: null, tab: 'fix', curPage: 1, onlySuspect: false, jobId: null };

  A.route('exam', async (view, params) => {
    if (params.mode && MODES.some((m) => m.id === params.mode)) S.mode = params.mode;
    if (params.doc) {
      const d = await A.DB.get('documents', params.doc);
      if (d) { S.doc = d; S.mode = d.mode; S.title = d.title; S.role = d.role; S.tab = 'fix'; S.curPage = 1; }
    }
    const root = h('div');
    view.append(root);
    const unsub = A.Jobs.on(() => {
      const j = S.jobId && A.Jobs.get(S.jobId);
      if (!j) return;
      const bar = root.querySelector('#run-progress');
      if (bar) { bar.querySelector('.bar-fill').style.width = j.progress + '%'; bar.querySelector('.st').textContent = j.stage; }
      if (['completed', 'needs_review'].includes(j.status) && j.result && S.doc !== j.result) { S.doc = j.result; S.tab = S.doc.mode === 'analyze' ? 'report' : S.doc.mode === 'structure' ? 'items' : 'fix'; S.curPage = 1; S.jobId = null; draw(); }
      if (['failed', 'cancelled'].includes(j.status)) { S.jobId = null; draw(); }
    });
    const onPaste = (e) => {
      const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith('image/'));
      if (files.length) { e.preventDefault(); addFiles(files); }
    };
    document.addEventListener('paste', onPaste);

    function draw() {
      root.innerHTML = '';
      root.append(
        h('div', { class: 'page-head' },
          h('div', null, h('h1', null, '시험지 분석·저장'), h('p', null, '시험지 사진·PDF·한글 파일을 읽어 글자로 바꾸고, 문항으로 나눠 출제 경향을 분석합니다.')),
          h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => A.go('library') }, '자료함'))),
        h('div', { class: 'stack' }, inputCard(), S.pages.length ? pagesCard() : emptyPagesCard(), runCard(), S.doc ? resultCard() : null));
    }

    // ---------- 1. 파일 넣기 ----------
    function inputCard() {
      const fileIn = h('input', { type: 'file', multiple: true, class: 'hidden', accept: '.pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.txt,.hwpx,.hwp,image/*', onchange: (e) => { addFiles([...e.target.files]); e.target.value = ''; } });
      const camIn = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hidden', onchange: (e) => { addFiles([...e.target.files]); e.target.value = ''; } });
      const drop = h('div', { class: 'drop', id: 'dropzone' },
        h('div', { html: icon('upload'), style: { width: '28px', height: '28px', margin: '0 auto 6px', color: 'var(--muted)' } }),
        h('b', null, '시험지 파일이나 사진을 끌어다 놓으세요'),
        h('p', null, 'PDF · 이미지(PNG, JPG, WebP, HEIC) · HWPX · TXT · 여러 장 한 번에 · Ctrl+V로 캡처 붙여넣기'),
        h('div', { class: 'row', style: { justifyContent: 'center' } },
          h('button', { class: 'btn primary', onclick: () => fileIn.click() }, '파일 선택'),
          h('button', { class: 'btn', onclick: () => camIn.click(), html: icon('camera') + '카메라로 찍기' })),
        fileIn, camIn);
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); });
      return h('div', { class: 'card' },
        h('div', { class: 'card-h' }, h('h3', null, '1  모드와 파일'), h('span', { class: 'sub' }, '모드는 실행 전에 언제든 바꿀 수 있어요')),
        h('div', { class: 'card-b stack' },
          h('div', { class: 'modes', role: 'radiogroup', 'aria-label': '처리 모드' }, MODES.map((m) => h('button', { class: 'mode' + (S.mode === m.id ? ' on' : ''), role: 'radio', 'aria-checked': String(S.mode === m.id), onclick: () => { S.mode = m.id; draw(); } }, h('b', null, m.name), h('span', null, m.desc)))),
          h('div', { class: 'grid2' },
            h('div', { class: 'field' }, h('label', null, '제목'), h('input', { class: 'input', placeholder: '예: 26-1-1 중간 원주고 2학년', value: S.title, oninput: (e) => (S.title = e.target.value) })),
            h('div', { class: 'field' }, h('label', null, '자료 역할'), h('select', { class: 'input', onchange: (e) => (S.role = e.target.value) }, ROLES.map((r) => h('option', { value: r, selected: S.role === r }, r))))),
          drop));
    }

    async function addFiles(files) {
      if (!files.length) return;
      for (const f of files) {
        try {
          A.toast(`${f.name || '이미지'} 읽는 중…`);
          const pages = await A.ocr.fileToPages(f);
          S.pages.push(...pages);
          if (!S.title) S.title = (f.name || '').replace(/\.[^.]+$/, '');
        } catch (e) { A.toast(e.message, 'bad'); }
      }
      draw();
    }

    function emptyPagesCard() {
      return h('div', { class: 'card', style: { opacity: 0.6 } },
        h('div', { class: 'card-h' }, h('h3', null, '2  쪽 정리'), h('span', { class: 'sub' }, '파일을 넣으면 여기에 쪽이 놓여요')),
        h('div', { class: 'card-b small muted' }, '쪽 순서 바꾸기, 돌리기, 펼친 면 두 쪽으로 나누기를 여기서 합니다.'));
    }

    // ---------- 2. 쪽 정리 ----------
    function pagesCard() {
      const strip = h('div', { class: 'pages' });
      let dragIdx = null;
      S.pages.forEach((p, i) => {
        const th = h('div', { class: 'th', draggable: 'true', style: p.src ? { backgroundImage: `url(${p.src})` } : null }, h('span', { class: 'no' }, i + 1), p.src ? null : h('span', null, `텍스트 ${p.lines?.length || 0}줄`));
        const card = h('div', { class: 'pg' }, th,
          h('div', { class: 'meta' }, h('span', { title: p.fname }, (p.fname || '').slice(0, 14)), h('span', { class: 'chip' + (p.kind === 'pdf_text' || p.kind === 'parsed' ? ' ok' : '') }, KIND_LABEL[p.kind])),
          h('div', { class: 'tools' },
            h('button', { title: '오른쪽으로 90° 회전', 'aria-label': `${i + 1}쪽 회전`, disabled: !p.src, onclick: async () => { S.pages[i] = await A.ocr.rotate(p, 90); draw(); } }, '회전'),
            h('button', { title: '펼친 면(B4 2쪽)을 두 쪽으로', 'aria-label': `${i + 1}쪽 2분할`, disabled: !p.src, onclick: async () => { S.pages.splice(i, 1, ...(await A.ocr.split(p))); draw(); } }, '2분할'),
            h('button', { title: '삭제', 'aria-label': `${i + 1}쪽 삭제`, onclick: () => { S.pages.splice(i, 1); draw(); } }, '삭제')));
        th.addEventListener('dragstart', () => { dragIdx = i; card.classList.add('dragging'); });
        th.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('over'); });
        card.addEventListener('dragleave', () => card.classList.remove('over'));

    // ---------- 3. 실행 ----------
    function runCard() {

            h('span', { class: 'spacer' }),
            j ? h('div', { id: 'run-progress', style: { width: '260px' } }, h('div', { class: 'small st', style: { marginBottom: '4px' } }, j.stage), h('div', { class: 'bar-track' }, h('div', { class: 'bar-fill', style: { width: j.progress + '%' } }))) : null,

    function editor(d) {

        h('thead', null, h('tr', null, ['쪽', '입력', '처리 경로', '최종', '평균 신뢰도', '의심 줄'].map((t) => h('th', null, t)))),

          h('td', null, KIND_LABEL[p.kind]),
          h('td', null, h('div', { class: 'chain' }, (p.fallback_path || []).map((x, i) => { const [e, o] = x.split(':'); return [i ? h('span', { class: 'arr' }, '→') : null, h('span', { class: 'chip ' + (o === 'ok' ? 'ok' : o === 'skipped' ? '' : 'warn') }, `${A.ENGINE_LABEL[e] || e} · ${A.OUTCOME_LABEL[o] || o}`)]; }))),

    A.exam = { addFiles, start, state: S };
    draw();
    return { cleanup: () => { unsub(); document.removeEventListener('paste', onPaste); delete A.exam; } };
  });
})(window.App);

<script>

(function (A) {

            h('h3', null, d.title || '제목 없음'),

              h('button', { class: 'btn sm ghost danger', onclick: async () => { if (!confirm('삭제할까요?')) return; await A.DB.del('annotations', d.id); annos.splice(annos.indexOf(d), 1); draw(); } }, '삭제'))));

      root.append(
        h('div', { class: 'page-head' }, h('div', null, h('h1', null, '자료함'), h('p', null, '만든 자료를 기간 제한 없이 보관합니다. 다시 출력해도 비용이 없어요.')),
          h('div', { class: 'row' },

        stale ? h('div', { class: 'card', style: { padding: '12px 16px', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '12px', borderColor: 'color-mix(in oklab, var(--warn) 50%, var(--line))' } },

        h('div', { class: 'row', style: { marginBottom: '12px' } },
          h('div', { class: 'seg' }, [['all', '전체'], ['doc', '시험지'], ['anno', '주석'], ['build', '설계도']].map(([k, l]) => h('button', { class: filter === k ? 'on' : '', onclick: () => { filter = k; draw(); } }, l)))),

<script>
/* 국어 스튜디오 - 주석 달기 (요청 1) + 주석교재 (요청 2, 시연판은 분량 계산·첨부자료 역할까지) */
(function (A) {
  'use strict';
  const { h, esc } = A;
  const CAT = {
    '어휘': '#2563eb', '현대어풀이': '#0891b2', '표현법': '#9333ea', '화자·정서': '#db2777', '인물·사건': '#ea580c',
    '구조': '#16a34a', '배경': '#64748b', '문법': '#0d9488', '출제포인트': '#dc2626', '기출연계': '#b45309',
  };
  const DENS = ['', '핵심만', '간결', '보통', '풍부', '촘촘'];
  const SAMPLE = { title: '진달래꽃', author: '김소월', text: '나 보기가 역겨워\n가실 때에는\n말없이 고이 보내 드리우리다.\n\n영변에 약산\n진달래꽃\n아름 따다 가실 길에 뿌리우리다.\n\n가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서.\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리우리다.' };
  const STOP = new Set(['그리고', '하지만', '그러나', '있는', '없는', '하는', '것은', '것이', '때에', '에서', '으로', '에게', '이다', '한다', '그는', '그의']);

  function detectGenre(text) {
    const lines = text.split('\n').filter((l) => l.trim());
    const avg = lines.reduce((a, l) => a + l.length, 0) / Math.max(1, lines.length);
    if (/[ㆍᆞᆢㅿㆁㆆ]/.test(text)) return '고전 시가';
    if (/["“”]/.test(text) && avg > 30) return '소설';
    if (avg < 32 && lines.length >= 3) return '현대시';
    return '비문학';
  }

  // ---------- 1단계: 규칙 기반 사전 주석 (무료, 즉시) ----------
  function ruleNotes(text, genre) {
    const notes = [];
    const add = (start, end, category, note, level) => { if (end > start) notes.push({ id: A.uid('n'), start, end, quote: text.slice(start, end), category, note, level, source: 'rule', anchor: 'exact', pinned: false, hidden: false }); };
    const lines = []; let off = 0;
    for (const l of text.split('\n')) { lines.push({ t: l, off }); off += l.length + 1; }
    const isPoem = /시|시가/.test(genre);

    // 수미상관: 첫 연과 마지막 연이 거의 같음
    const stanzas = text.split(/\n\s*\n/);
    if (isPoem && stanzas.length >= 3) {
      const norm = (s) => s.replace(/\s/g, '').slice(0, 10);
      if (norm(stanzas[0]) === norm(stanzas[stanzas.length - 1])) add(0, stanzas[0].split('\n')[0].length, '구조', '수미상관: 첫 연을 마지막 연에서 되풀이해 구조적 안정감과 주제 강조', 1);
    }
    for (const { t, off: o } of lines) {
      if (!t.trim()) continue;
      let m;
      const reEx = /(아아|오오|어즈버|아으)|[가-힣]+(구나|도다|로다|노라)(?=[\s.,!?]|$)/g;
      while ((m = reEx.exec(t))) add(o + m.index, o + m.index + m[0].length, '표현법', '영탄: 감탄의 말로 감정을 직접 드러냄', 2);
      const last = t.trim().match(/([가-힣]+)([?？]|[.]?)$/);
      if (last && (/[?？]$/.test(t.trim()) || /(랴|리오|리요|ㄴ가|는가|겠는가|을쏘냐|던가)$/.test(last[1]))) { const s = o + t.lastIndexOf(last[1]); add(s, s + last[1].length, '표현법', '설의: 묻는 형식으로 뜻을 강조', 2); }
      else if (last && /(옵소서|소서|어라|아라|거라|시오)$/.test(last[1])) { const s = o + t.lastIndexOf(last[1]); add(s, s + last[1].length, '화자·정서', '명령·기원형 어미: 청자에게 바라는 화자의 태도', 2); }
      else if (last && isPoem && /(우리다|리라|오리다|겠다|리로다)$/.test(last[1])) { const s = o + t.lastIndexOf(last[1]); add(s, s + last[1].length, '화자·정서', '의지·다짐의 어미: 화자의 굳은 태도(반어 여부 확인)', 2); }
      const reColor = /(푸른|붉은|하얀|흰|검은|노란|파란|초록|금빛|은빛|잿빛|빨간)/g;
      while ((m = reColor.exec(t))) add(o + m.index, o + m.index + m[0].length, '표현법', '색채 이미지: 시각적 심상', 4);
      const reDup = /([가-힣]{2})\1/g;
      while ((m = reDup.exec(t))) add(o + m.index, o + m.index + m[0].length, '표현법', '음성 상징·반복어: 리듬감과 생동감', 4);
      const reHanja = /([가-힣]+)\(([\u4e00-\u9fff]+)\)/g;
      while ((m = reHanja.exec(t))) add(o + m.index, o + m.index + m[0].length, '어휘', `한자 병기 어휘: ${m[1]}(${m[2]}) 뜻 확인`, 3);
      if (/[ㆍᆞᆢㅿㆁㆆ]/.test(t)) add(o, o + Math.min(t.length, 12), '현대어풀이', '옛 표기: 현대어 풀이 필요', 2);
      const reEllip = /…|\.{3}/g;
      while ((m = reEllip.exec(t))) add(o + Math.max(0, m.index - 4), o + m.index + m[0].length, '표현법', '말줄임: 여운을 남김', 4);
      if (!isPoem) {
        const reConn = /(^|[.!?]\s*)(그러나|하지만|반면|따라서|그러므로|결국|예를 들어|가령|즉|다시 말해)(?=[\s,])/g;
        const kind = { 그러나: '전환·대조', 하지만: '전환·대조', 반면: '대조', 따라서: '결론', 그러므로: '결론', 결국: '결론', '예를 들어': '예시', 가령: '예시', 즉: '부연', '다시 말해': '부연' };
        while ((m = reConn.exec(t))) { const s = o + m.index + m[1].length; add(s, s + m[2].length, '구조', `접속 표현(${kind[m[2]]}): 글의 흐름이 바뀌는 지점`, ['결론', '전환·대조'].includes(kind[m[2]]) ? 2 : 3); }
        const reDef = /([가-힣][가-힣\s]{1,18}?)(이란|란|이라고 한다|라고 한다|을 말한다|를 말한다|을 뜻한다|를 뜻한다)/g;
        while ((m = reDef.exec(t))) add(o + m.index, o + m.index + m[0].length, '출제포인트', '개념 정의: 선지에서 그대로 묻는 경우가 많음', 1);
        if (/^["“]/.test(t.trim())) add(o + t.indexOf(t.trim()), o + Math.min(t.length, t.indexOf(t.trim()) + 14), '인물·사건', '대화: 인물의 성격·관계가 드러남', 3);
      }
    }
    if (isPoem) {
      const first = text.match(/(나는|내가|나의|나\s|우리)/);
      if (first) add(first.index, first.index + first[0].trim().length, '화자·정서', '화자가 겉으로 드러남(1인칭)', 3);
      // 같은 시행 반복 (줄 단위) 먼저, 그다음 단어 반복
      const lineCount = new Map();
      for (const { t } of lines) { const k = t.trim(); if (k.length >= 3) lineCount.set(k, (lineCount.get(k) || 0) + 1); }
      const repLines = [...lineCount.entries()].filter(([, n]) => n >= 2).map(([k]) => k);
      for (const k of repLines) {
        const L = lines.find((x) => x.t.trim() === k);
        const s0 = L.off + L.t.indexOf(k);
        if (!notes.some((x) => x.start <= s0 && x.end >= s0 + 2 && x.category === '구조')) add(s0, s0 + k.length, '표현법', `시행 반복: 같은 행이 ${lineCount.get(k)}번 나와 운율과 주제 강조`, 2);
      }
      const inRepLine = (w) => repLines.some((k) => k.includes(w));
      const counts = new Map();
      for (const w of text.match(/[가-힣]{2,}/g) || []) if (!STOP.has(w)) counts.set(w, (counts.get(w) || 0) + 1);
      const reps = [...counts.entries()].filter(([w, n]) => n >= 2 && !inRepLine(w)).sort((a, b) => b[1] - a[1]).slice(0, 2);
      for (const [w, n] of reps) {
        const at = text.indexOf(w);
        if (notes.some((x) => x.start <= at && x.end >= at + w.length)) continue;
        add(at, at + w.length, '표현법', `반복: '${w}'이(가) ${n}번 나와 운율과 의미를 강조`, n >= 3 ? 2 : 3);
      }
    }
    return notes.sort((a, b) => a.start - b.start || a.level - b.level);
  }

  // ---------- 위치 복구 (정확히 → 공백·부호 무시 → 실패) ----------
  function anchor(text, quote) {
    let i = text.indexOf(quote);
    if (i >= 0) return { start: i, end: i + quote.length, anchor: 'exact' };
    const map = []; let stripped = '';
    for (let k = 0; k < text.length; k++) if (!/[\s.,!?·'"“”‘’()\-]/.test(text[k])) { map.push(k); stripped += text[k]; }
    const q = quote.replace(/[\s.,!?·'"“”‘’()\-]/g, '');
    if (q.length >= 2) { i = stripped.indexOf(q); if (i >= 0) return { start: map[i], end: map[i + q.length - 1] + 1, anchor: 'fuzzy' }; }
    return { start: -1, end: -1, anchor: 'lost' };
  }

  async function aiNotes(doc, ctx) {
    const prompt = `너는 고등학교 국어 교사다. 아래 ${doc.genre} 작품(또는 지문)에 수업용 주석을 달아라.
규칙: quote는 원문에 있는 그대로의 짧은 구절(2~15자). 원문 전체를 다시 쓰지 말 것.
category는 ${Object.keys(CAT).join(', ')} 중 하나. level은 중요도 1(가장 중요)~5. note는 60자 이내.
JSON {"notes":[{"quote":"…","category":"…","note":"…","level":1}]} 로만 답하라. 25개 이내.
제목: ${doc.title} ${doc.author ? '/ ' + doc.author : ''}
원문:
${doc.text}`;
    ctx.stage('AI 주석 생성', 30);
    const r = await A.gemini([{ text: prompt }]);
    if (A.classifyOutcome(r.finishReason, (r.text || '').length, 0) !== 'ok' || !Array.isArray(r.json?.notes)) { const e = new Error(`AI 주석 실패 (${r.finishReason})`); throw e; }
    ctx.stage('위치 연결', 80);
    return r.json.notes.map((n) => ({ ...anchor(doc.text, n.quote || ''), id: A.uid('n'), quote: n.quote, category: CAT[n.category] ? n.category : '출제포인트', note: String(n.note || '').slice(0, 160), level: Math.min(5, Math.max(1, +n.level || 3)), source: 'ai', pinned: false, hidden: false }));
  }

  A.route('annotate', async (view, params) => {
    const s = A.Settings.get();
    let doc = params.id ? await A.DB.get('annotations', params.id) : null;
    if (!doc) doc = A.annoDraft || { id: A.uid('an_'), ...SAMPLE, genre: detectGenre(SAMPLE.text), notes: [], density: s.annotation.density, layout: s.annotation.layout, created_at: Date.now() };
    A.annoDraft = doc;
    if (!doc.notes.length && doc.text) doc.notes = ruleNotes(doc.text, doc.genre);
    const root = h('div');
    view.append(root);
    let hideCats = new Set();
    let aiJob = null;
    const unsub = A.Jobs.on(() => { if (aiJob && !['queued', 'running'].includes(aiJob.status)) { aiJob = null; draw(); } });

    function visible() { return doc.notes.filter((n) => n.start >= 0 && !n.hidden && !hideCats.has(n.category) && (n.pinned || n.level <= doc.density)); }
    function draw() {
      root.innerHTML = '';
      const vis = visible();
      const lost = doc.notes.filter((n) => n.anchor === 'lost');
      const counts = {};
      for (const n of doc.notes) counts[n.category] = (counts[n.category] || 0) + 1;
      const est = estimatePages(doc, vis);
      const left = h('div', { class: 'card' },
        h('div', { class: 'card-h' }, h('h3', null, '지문 넣기'), h('span', { class: 'sub' }, '붙여넣으면 바로 무료 사전 주석')),
        h('div', { class: 'card-b stack' },
          h('div', { class: 'grid2', style: { gridTemplateColumns: '1fr 1fr' } },
            h('div', { class: 'field' }, h('label', null, '제목'), h('input', { class: 'input', value: doc.title || '', oninput: (e) => (doc.title = e.target.value) })),
            h('div', { class: 'field' }, h('label', null, '작가'), h('input', { class: 'input', value: doc.author || '', oninput: (e) => (doc.author = e.target.value) }))),
          h('div', { class: 'field' }, h('label', null, '갈래'), h('select', { class: 'input', onchange: (e) => { doc.genre = e.target.value; rerun(); } }, ['현대시', '고전 시가', '소설', '비문학'].map((g) => h('option', { selected: doc.genre === g }, g)))),
          h('div', { class: 'field' }, h('label', null, '원문'), h('textarea', { class: 'input', rows: 14, 'aria-label': '원문', oninput: (e) => { doc.text = e.target.value; clearTimeout(doc._t); doc._t = setTimeout(() => { doc.genre = detectGenre(doc.text); rerun(); }, 600); } }, doc.text)),
          h('div', { class: 'row' },
            h('button', { class: 'btn', onclick: rerun }, '사전 주석 다시'),
            h('button', { class: 'btn primary', disabled: !!aiJob || !doc.text.trim(), title: s.ai.geminiKey ? '' : '설정 > OCR·AI에 Gemini 키를 넣으면 켜져요', onclick: runAI }, aiJob ? 'AI 주석 중…' : 'AI 주석 추가 (2단계)')),
          !A.Settings.get().ai.geminiKey ? h('div', { class: 'small muted' }, 'AI 주석은 설정에 Gemini 키가 있을 때 동작해요. 지금 보이는 주석은 규칙 기반 1단계(무료)입니다.') : null,
          lost.length ? h('div', { class: 'small', style: { color: 'var(--warn)' } }, `위치를 못 찾은 주석 ${lost.length}개: ${lost.map((n) => '"' + n.quote + '"').join(', ')} (버리지 않고 보관)`) : null));

      const out = h('div', { class: 'anno-out ' + (doc.layout === 'note' ? 'note' : '') });
